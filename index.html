<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magical Spell Generator</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>Welcome to the Magical Spell Generator!</h1>
  <div id = "spellArea">
    <p>Come forth and create a spell, but be warned!</p>
    <p>Now choose your ingredients wisely, or face the consequences!</p>
    <div id = "ingredientsList">
      <ul>
        <li>Dragon Scale</li>
        <li>Unicorn Horn</li>
        <li>Phoenix Feather</li>
      </ul>
    </div>
    <div id = "spellResult">
      <p>Your spell will appear here...</p>
    </div>
    <button id = "generateButton">Generate Spell</button>
    <button id = "resetButton">Reset</button>
  </div>
  


  <script  src="./script.js"></script>
</body>
</html>
